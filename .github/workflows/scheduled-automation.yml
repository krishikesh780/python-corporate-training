# Week6 Project 6 — scheduled + manual automation trigger
# Actions tab -> Run workflow | cron: Mon 06:00 UTC (edit below)

name: Scheduled automation

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      notify:
        description: "POST webhook after job"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automation job
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          AUTOMATION_WEBHOOK_URL: ${{ secrets.AUTOMATION_WEBHOOK_URL }}
          AUTOMATION_NOTIFY: ${{ github.event.inputs.notify }}
        run: |
          cd week6/project6_schedule_triggers
          if [ "${{ github.event.inputs.notify }}" = "true" ]; then
            python run_job.py --notify
          else
            python run_job.py
          fi

      - name: Upload job report
        uses: actions/upload-artifact@v4
        with:
          name: automation-reports
          path: week6/project6_schedule_triggers/_runs/*.json
          if-no-files-found: ignore